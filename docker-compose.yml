name: fi-bot

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fi
      POSTGRES_PASSWORD: fi
      POSTGRES_DB: fi_bot
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fi -d fi_bot']
      interval: 10s
      timeout: 5s
      retries: 5

  material-seed:
    image: node:24-bookworm-slim
    working_dir: /workspace
    environment:
      DATABASE_URL: postgres://fi:fi@postgres:5432/fi_bot
      CI: 'true'
    volumes:
      - .:/workspace
    depends_on:
      postgres:
        condition: service_healthy
    command: >-
      sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm db:migrate &&
      pnpm db:seed-material"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
