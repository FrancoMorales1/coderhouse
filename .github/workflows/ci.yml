name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'

jobs:
  quality:
    name: ${{ matrix.task.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task:
          - { name: format, run: pnpm format:check }
          # Los packages se resuelven por sus .d.ts en dist/, así que el linter
          # con tipos necesita el build hecho: en un runner limpio no existe.
          - { name: lint, run: 'pnpm build && pnpm lint --max-warnings=0' }
          - { name: build, run: pnpm build }
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: ${{ matrix.task.name }}
        run: ${{ matrix.task.run }}

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fi
          POSTGRES_PASSWORD: fi
          POSTGRES_DB: fi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://fi:fi@localhost:5432/fi_test
      REDIS_URL: redis://localhost:6379
      GEMINI_API_KEY: test-key

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (los tests importan los dist de los packages)
        run: pnpm build

      - name: Test + coverage
        run: pnpm test:coverage

      - name: Subir reporte de coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  ci-ok:
    name: CI OK
    if: always()
    needs: [quality, test]
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que no falló ningún job
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "Algún job de CI falló."
            exit 1
          fi
          echo "Todo verde."
